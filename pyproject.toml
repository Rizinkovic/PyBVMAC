[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybvmac"
version = "0.2.1"
description = "Open source Python client for BVMAC (Bourse des Valeurs Mobilieres de l'Afrique Centrale) market data, in the spirit of yfinance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Song Richard" }]
keywords = ["bvmac", "cemac", "stock-exchange", "finance", "pandas", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pdfplumber>=0.11",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "Pillow>=10.0"]
parquet = ["pyarrow>=14.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
pybvmac = "pybvmac.cli:main"

[project.urls]
Homepage = "https://github.com/Rizinkovic/PyBVMAC"
Documentation = "https://github.com/Rizinkovic/PyBVMAC#readme"
Issues = "https://github.com/Rizinkovic/PyBVMAC/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybvmac = ["data/*.csv"]
