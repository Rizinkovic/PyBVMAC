name: Daily BOC update

# FR-15: run the daily data collection job automatically through a
# scheduled workflow. BVMAC publishes the BOC after market close on trading
# days (Mon-Fri); 19:00 UTC (~20:00/21:00 local, CEMAC is UTC+1) gives the
# bulletin time to be published.
on:
  schedule:
    - cron: "0 19 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Store the dataset inside the checked-out repo so it can be committed.
      PYBVMAC_HOME: ${{ github.workspace }}/.pybvmac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyBVMAC
        run: pip install -e ".[parquet]"

      - name: Fetch and store today's bulletin
        run: pybvmac refresh -v

      - name: Commit updated dataset
        run: |
          git config user.name "pybvmac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .pybvmac/data/ || true
          git diff --quiet --cached || git commit -m "chore: daily BOC update $(date -u +%F)"
          git push
